# SwitchYard routing config for this folder's pi container.
#
# Two llm_clients, mirroring two of the providers pi already talks to
# directly in this project's other folders:
#   - nvidia: NVIDIA NIM, OpenAI-chat wire format, cloud, shared quota.
#   - ollama: Ollama running natively on the Mac host (for Metal), reached
#     via Docker's host.docker.internal bridge, OpenAI-chat wire format,
#     free/instant.
#
# Update: Bedrock IS wired in below, via a client different from pi's own
# built-in amazon-bedrock provider. That provider speaks Bedrock's native
# "bedrock-converse-stream" wire protocol (SigV4/bearer-token, a
# /model/{id}/converse-stream path) — not one of Switchyard's three
# supported formats, so it genuinely can't be routed through here.
# What changed: AWS separately shipped an OpenAI-compatible surface on
# bedrock-runtime itself (confirmed via AWS's own endpoint docs, not
# guessed) — reachable at a plain /openai/v1 path using the same
# AWS_BEARER_TOKEN_BEDROCK bearer token already used elsewhere in this
# project. That surface IS openai_chat-compatible, so it's just another
# llm_client below, same shape as nvidia.
schema_version = 1

[llm_clients.nvidia]
format = "openai_chat"
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
max_retries = 6

[llm_clients.ollama]
format = "openai_chat"
base_url = "http://host.docker.internal:11434/v1"

[llm_clients.bedrock]
# bedrock-runtime's OpenAI-compatible Chat Completions surface. Confirmed
# empirically this only works for models actually built to that wire shape
# (openai.* models hosted on Bedrock) — Amazon's own Nova models are not
# exposed here at all, and Anthropic Claude models exist but reject this
# format outright ("does not support the /v1/chat/completions API").
format = "openai_chat"
base_url = "https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1"
api_key_env = "AWS_BEARER_TOKEN_BEDROCK"
max_retries = 2

# Anthropic Claude on Bedrock needs a different client entirely (format =
# "anthropic_messages", header "x-api-key" not "Authorization: Bearer") —
# confirmed via a clean permission_error, meaning the request itself was
# correctly formed, but blocked on this account's Bedrock model-access
# grant. Not wired in for now: chose zai.glm-5 (open-source, no access gate,
# confirmed working immediately) as the hefty tier instead. Revisit if
# Claude access gets granted and a Claude-specific tier is wanted later.

# llm_clients.openai (gpt-5.1, last resort in the failover chain) is not
# wired in yet: switchyard-server validates every configured client's
# api_key_env eagerly at startup and refuses to start at all if it's empty
# — not a soft per-request failure, the whole server won't boot. Add it
# back (client + targets.openai-gpt51 + routes.openai-gpt51 + CHAIN entry
# in failover-proxy.mjs) once a real OPENAI_API_KEY is in .env.

[targets.local]
# llama3.2:1b (the original pick) proved too weak for pi's actual
# system-prompt weight: real end-to-end runs showed it repeatedly latching
# onto fragments of pi's own tool-schema text instead of answering trivial
# questions ("say hi", "capital of France"), both as the served model and
# as the classifier itself (classifier_target below reuses this target).
# llama3.1:8b is a real instruction-tuned model, already pulled on the host
# — swapped in to see if actual instruction-following capacity, not routing
# logic, was the missing piece.
id = "llama3.1:8b"
llm_client = "ollama"

[targets.cloud]
id = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
llm_client = "nvidia"

# Task-type target for routes.smart-v2 below. NVIDIA NIM also serves a
# code-specialized Qwen model behind the same integrate.api.nvidia.com
# endpoint and NVIDIA_API_KEY — no new client needed. (There's no separate
# targets.reasoning: Switchyard drops one of two targets that share the same
# model id + client pair — "target X reuses model id ... only one target per
# id is kept" — so routes.smart-v2 reuses targets.cloud directly instead.)
[targets.coding]
# Every dedicated code model in NVIDIA's own /v1/models catalog for this
# account turned out to be a phantom listing: qwen/qwen2.5-coder-32b-instruct
# is a hard 410 (EOL 2026-05-12), and codestral/codellama/codegemma/granite/
# starcoder/deepseek-coder all 404 ("Function ... Not found for account") —
# confirmed by curling each directly against integrate.api.nvidia.com, not
# guessed. Checked Bedrock's catalog instead (same account, no new key
# needed) and found a genuinely-hosted dedicated coder: Mistral's Devstral,
# purpose-built for software-engineering tasks. Confirmed live against
# bedrock-runtime (HTTP 200) and verified to produce correct, well-explained
# code on a real prompt — a real coding-specialist model, not a substitute.
# (qwen.qwen3-coder-next also works on this account if Devstral ever needs
# a second option; qwen3-coder-30b/480b's ids from bedrock-mantle's listing
# are rejected as invalid on bedrock-runtime, same class of quirk as
# gpt-oss's "-1:0" suffix requirement above.)
id = "mistral.devstral-2-123b"
llm_client = "bedrock"

[targets.vision]
# Manual-switch image target — none of the routes above accept images: the
# smart-v2 judge and every text target it can pick were never checked against
# vision input, and blind-forwarding an image through them would either be
# silently ignored or upstream-error depending on the model. This is a
# separate, deliberately unrouted passthrough model instead (see routes.vision
# below) — you pick it explicitly when you have an image to paste.
# meta/llama-3.2-11b-vision-instruct confirmed live on this NVIDIA account
# (HTTP 200, correctly read a real test image) — same catalog that had
# multiple phantom listings for coding models above. microsoft/phi-3-vision
# -128k-instruct, nvidia/vila, and nvidia/neva-22b, all also listed in
# NVIDIA's /v1/models, are more of those phantoms: 404 "Function ... Not
# found for account". meta/llama-3.2-90b-vision-instruct is also real and
# untested here — bigger/slower, worth trying if 11b proves too coarse on
# dense screenshots.
#
# Known gotcha, not a config bug: calling this route from a normal pi session
# fails with "The number of image tokens (0) must be the same as the number
# of images (1)" — NVIDIA's vLLM-hosted mllama (Llama-3.2-Vision) backend
# miscounts image placeholder tokens against pi's large tool-schema system
# prompt. Confirmed via curl (works, no tools involved) vs. through pi
# (fails). CLI `--provider`/`--model` startup needs `--no-tools` yourself;
# switching via /model or Ctrl+P mid-session is handled automatically by
# pi-extensions/vision-tools-guard.mjs — see tests/README.md.
id = "meta/llama-3.2-11b-vision-instruct"
llm_client = "nvidia"

[targets.local-big]
# A free step up before spending anything: if the classifier's own pick
# fails (either leg — nvidia rate-limited, or ollama itself down), try a
# noticeably bigger local model before falling through to paid Bedrock/
# OpenAI. Still $0, just slower (~9GB at Q4, meaningfully heavier than
# llama3.1:8b) — an acceptable tradeoff since this only fires on failure,
# not on every request.
id = "qwen2.5:14b"
llm_client = "ollama"

# Availability fallback chain, cheapest to most capable — not used by
# routes.smart's classifier at all. These exist so failover-proxy.mjs (which
# sits in front of Switchyard, see entrypoint.sh) has somewhere to retry a
# request when the classifier's own choice (nvidia or ollama) fails outright,
# not just when it's the "wrong" tier for the task. Switchyard itself has no
# concept of "retry a different provider on error" — this fallback chain is
# only meaningful because something outside Switchyard drives it.
#
# Amazon Nova (micro/lite) and Claude Haiku are deliberately NOT here.
# Nova: confirmed unreachable via any Switchyard-compatible format — not in
# Bedrock's OpenAI-compatible catalog at all, only its native Converse API.
# Haiku: same account-level Bedrock model-access block as Sonnet below,
# and its exact model ID on this surface is still unconfirmed — not worth
# guessing further until access is actually granted.
[targets.bedrock-gptoss]
# Confirmed working end-to-end. Needed the "-1:0" suffix specifically —
# the bare "openai.gpt-oss-20b" id (as listed by bedrock-mantle's own
# /v1/models) was rejected as invalid on bedrock-runtime.
id = "openai.gpt-oss-20b-1:0"
llm_client = "bedrock"

[targets.bedrock-glm]
# GLM-5 (Z.AI), open-source, hosted on Bedrock — confirmed working
# immediately with the bare model id, no access grant needed, $1/$3.2 per
# 1M tokens. The hefty tier, standing in for Claude Sonnet until Bedrock
# model access for Anthropic models is sorted out (see above).
id = "zai.glm-5"
llm_client = "bedrock"

# Main demo route: a cheap local classification call (reusing the weak
# target as the classifier itself, per Switchyard's own getting-started
# pattern) decides per-request whether the task is simple enough to stay on
# local Ollama or should escalate to the cloud NVIDIA model.
[routes.smart]
id = "switchyard"
type = "llm_classifier"
mode = "capability"
classifier_target = "local"
weak_target = "local"
strong_target = "cloud"
base_threshold = 0.5

# Task-type-aware route: a 3-way custom classifier, not the weak/strong
# binary escalation routes.smart above does. Same judge model (local,
# reused, free), but instead of estimating "can the weak model handle this,"
# it reads the request and decides which of three specialized targets fits:
# a simple/conversational tier, a coding-specialized model, or a
# reasoning-specialized model. mode = "custom" is what unlocks this — the
# packaged capability/escalation modes are hardcoded to exactly two targets
# (weak_target/strong_target); custom mode takes an arbitrary `targets` list
# instead, a free-form judge `prompt`, and a `response_schema` the judge's
# JSON verdict must satisfy. `policy.selector` is a JSON Pointer
# (jsonptr) into that verdict telling Switchyard which field names the
# chosen target; a missing/unrecognized value falls back to
# `default_target` rather than erroring the request.
[routes.smart-v2]
id = "switchyard-v2"
type = "llm_classifier"
mode = "custom"
classifier_target = "local"
targets = ["local", "coding", "cloud"]
default_target = "local"
prompt = """
Classify the user's most recent request into exactly one category:
- "local": simple conversational requests, greetings, or short factual
  lookups that need no code and no multi-step reasoning.
- "coding": requests to write, debug, review, or explain source code in
  any programming language.
- "cloud": requests that need deep multi-step reasoning, mathematical
  proof, research synthesis, or complex analysis beyond simple recall.
Return JSON matching the response schema supplied with the request.
"""
response_schema = '''
{
  "type": "object",
  "properties": {
    "decision": {
      "type": "object",
      "properties": {
        "target": {
          "type": "string",
          "enum": ["local", "coding", "cloud"]
        }
      },
      "required": ["target"],
      "additionalProperties": false
    }
  },
  "required": ["decision"],
  "additionalProperties": false
}
'''

[routes.smart-v2.policy]
type = "target_selector"
selector = "/decision/target"

# Manual-test routes: bypass the classifier and hit one provider directly
# through Switchyard. Useful for curl-ing each leg in isolation, and for
# `pi --provider switchyard --model local|cloud` to force a side.
[routes.local]
id = "local"
type = "passthrough"
target = "local"

[routes.cloud]
id = "cloud"
type = "passthrough"
target = "cloud"

[routes.vision]
id = "vision"
type = "passthrough"
target = "vision"

# Fallback-chain routes — each just a plain passthrough, dialed directly by
# failover-proxy.mjs's CHAIN constant when an earlier attempt fails. Not part
# of the classifier; these never get picked by routes.smart on their own.
[routes.local-big]
id = "local-big"
type = "passthrough"
target = "local-big"

[routes.bedrock-gptoss]
id = "bedrock-gptoss"
type = "passthrough"
target = "bedrock-gptoss"

[routes.bedrock-glm]
id = "bedrock-glm"
type = "passthrough"
target = "bedrock-glm"
