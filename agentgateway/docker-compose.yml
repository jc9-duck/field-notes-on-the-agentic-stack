services:
  math-server:
    build: ./math-server
    # No published host port — reached only via Compose's internal DNS
    # (agentgateway's config.yaml.template targets it as
    # http://math-server:3001/mcp). Nothing outside this compose network
    # should be able to bypass the gateway to reach it directly, which is
    # also true of docs-server below by the same reasoning (its
    # gateway-bypass proof step uses `docker compose exec`, not a published
    # port).

  docs-server:
    build: ./docs-server
    environment:
      - DOCS_DIR=/data/sample-docs
    volumes:
      # Real files on the host, not an in-memory store — read returns
      # genuinely readable content, and write/delete visibly mutate this
      # folder. Not read-only: docs-server's own write/delete tools need to
      # write here; the *gateway* (not a read-only mount) is what's
      # actually restricting access from the outside.
      - ./docs-server/sample-docs:/data/sample-docs

  # Renders config.yaml.template -> config.yaml (see config-init/Dockerfile
  # for why this can't happen inside agentgateway's own container) into a
  # volume shared with the agentgateway service below, then exits.
  config-init:
    build: ./config-init
    volumes:
      - ./config.yaml.template:/template/config.yaml.template:ro
      - agentgateway-config:/config
    environment:
      # The only provider-specific values in this whole stack. Swapping
      # identity providers later means changing these three (see
      # identity-providers/), never config.yaml.template or the CEL policy.
      - OIDC_ISSUER=${OIDC_ISSUER:?set OIDC_ISSUER in .env - see identity-providers/cognito.env.example}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:?set OIDC_AUDIENCE in .env - see identity-providers/cognito.env.example}
      - OIDC_JWKS_URI=${OIDC_JWKS_URI:?set OIDC_JWKS_URI in .env - see identity-providers/cognito.env.example}

  agentgateway:
    # Official distroless image, not built from source — see
    # config-init/Dockerfile for why config rendering had to move to a
    # sidecar as a consequence of that choice.
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    depends_on:
      config-init:
        condition: service_completed_successfully
      math-server:
        condition: service_started
      docs-server:
        condition: service_started
    volumes:
      - agentgateway-config:/config
    command: ["-f", "/config/config.yaml"]
    ports:
      # The one endpoint clients talk to — multiplexes math-server and
      # docs-server behind /mcp. Also serves the admin UI at
      # http://localhost:4000/ui (agentgateway's actual admin port, 15000,
      # isn't published — reachable only through this same port).
      - "4000:4000"

  # Consistent with every other folder in this series (pi-multi-provider/,
  # mcp/, model-router/): pi is the client demonstrating the thing this
  # folder builds. Talks to agentgateway the same way mcp/.mcp.json talks
  # to external MCP servers — one more entry, not a special case.
  pi:
    build: .
    working_dir: /work
    volumes:
      - .:/work
      - ~/.aws:/root/.aws:ro
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # A short-lived Cognito-issued JWT, minted manually (see
      # identity-providers/cognito.env.example for how) and exported before
      # `docker compose run` — .mcp.json substitutes it into the gateway
      # request's Authorization header the same way mcp/.mcp.json already
      # does for GH_TOKEN. Expect to refresh this periodically; Cognito
      # access tokens are short-lived by design.
      - AGENTGATEWAY_TOKEN=${AGENTGATEWAY_TOKEN:-}
    depends_on:
      - agentgateway
    stdin_open: true
    tty: true
    command: bash

volumes:
  agentgateway-config:
