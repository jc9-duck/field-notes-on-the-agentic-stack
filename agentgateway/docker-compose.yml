services:
  # Two separate Inspector instances, not one -- so the raw docs-server tool
  # list (read/write/delete) and the gateway-filtered one (read only) are
  # each already connected in their own tab, side by side, instead of one
  # Inspector you manually re-point back and forth. Each one's "open this
  # URL" link below is an Inspector deep link (serverUrl + transport +
  # autoConnect query params -- see clients/web/src/utils/deepLink.ts in the
  # inspector repo at this pinned version): it connects automatically on
  # load, no manual form-filling. autoConnect must equal
  # MCP_INSPECTOR_API_TOKEN below -- that's Inspector's CSRF gate on
  # auto-connecting at all, not a real secret, so a fixed, obviously-a-dev-
  # value token (rather than the random one Inspector would otherwise print
  # per launch) is what makes the link in README.md reusable across restarts.
  #
  # Published on 7xxx/72xx, not mcp/'s 6274/6275/6278 -- same reason as
  # switchyard's 5xxx->6xxx shift (see entrypoint.sh comments): both folders'
  # Inspector can then run at the same time without a port collision. Only
  # the host-side mapping shifts; CLIENT_PORT etc. below (what Inspector
  # binds to *inside* each container) are untouched, same pattern as
  # docs-server's "3102:3002".
  #
  # 127.0.0.1-prefixed (not a bare "7274:6274"): Inspector's own docs
  # (docs/docker.md at this pinned version) call out that a bare publish
  # puts the Inspector -- and the API token GET / discloses -- on the whole
  # local network, since HOST=0.0.0.0/DANGEROUSLY_BIND_ALL_INTERFACES below
  # only govern the *container's* interface, not the host-side publish
  # scope. Loopback-only here is the fix they document.
  mcp-inspector-docs-server:
    image: node:22-slim
    working_dir: /work
    command: ["npx", "-y", "@modelcontextprotocol/inspector@2.6.0"]
    environment:
      - HOST=0.0.0.0
      - DANGEROUSLY_BIND_ALL_INTERFACES=true
      - CLIENT_PORT=6274
      - MCP_SANDBOX_PORT=6275
      - MCP_APP_ORIGIN_PORT=6278
      - MCP_INSPECTOR_API_TOKEN=agentgateway-demo
    ports:
      - "127.0.0.1:7274:6274"   # http://localhost:7274/?serverUrl=http%3A%2F%2Fdocs-server%3A3002%2Fmcp&transport=http&autoConnect=agentgateway-demo
      - "127.0.0.1:7275:6275"   # MCP Apps sandbox iframe
      - "127.0.0.1:7278:6278"   # MCP Apps origin (only used by servers declaring _meta.ui.domain)

  mcp-inspector-gateway:
    image: node:22-slim
    working_dir: /work
    command: ["npx", "-y", "@modelcontextprotocol/inspector@2.6.0"]
    environment:
      - HOST=0.0.0.0
      - DANGEROUSLY_BIND_ALL_INTERFACES=true
      - CLIENT_PORT=6274
      - MCP_SANDBOX_PORT=6275
      - MCP_APP_ORIGIN_PORT=6278
      - MCP_INSPECTOR_API_TOKEN=agentgateway-demo
    ports:
      - "127.0.0.1:7284:6274"   # http://localhost:7284/?serverUrl=http%3A%2F%2Fagentgateway%3A4000%2Fmcp&transport=http&autoConnect=agentgateway-demo
      - "127.0.0.1:7285:6275"   # MCP Apps sandbox iframe
      - "127.0.0.1:7288:6278"   # MCP Apps origin (only used by servers declaring _meta.ui.domain)

  math-server:
    build: ./math-server
    # No published host port -- no interesting policy on this target, so
    # there's nothing to contrast a "raw" view against (unlike docs-server
    # below, which is the actual before/after demo).
    volumes:
      # Structured per-call log (mcp-calls.jsonl), shared with docs-server
      # below and read by mcp-trace-server.mjs inside the pi container --
      # same pattern as mcp/'s copy of this service.
      - ./logs:/data/logs

  docs-server:
    build: ./docs-server
    environment:
      - DOCS_DIR=/data/sample-docs
    ports:
      # 3102, not 3002 -- mcp/'s own docs-server already publishes 3002, and
      # with both folders' docs-server ports live at once (a real conflict
      # hit while building this), only one can actually bind it. Published
      # so MCP Inspector (or curl) can connect directly to
      # http://localhost:3102/mcp and see read/write/delete all present and
      # working -- the "raw" half of the before/after demo. Contrast this
      # against the same backend through agentgateway on :4000, where the
      # config.yaml policy filters write/delete out of tools/list entirely.
      - "3102:3002"
    volumes:
      # Real files on the host, not an in-memory store — read returns
      # genuinely readable content, and write/delete visibly mutate this
      # folder. Not read-only: docs-server's own write/delete tools need to
      # write here; the *gateway* (not a read-only mount) is what's
      # actually restricting access from the outside.
      - ./docs-server/sample-docs:/data/sample-docs
      # Same shared call-log directory as math-server above.
      - ./logs:/data/logs

  agentgateway:
    # Official distroless image, not built from source.
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    depends_on:
      math-server:
        condition: service_started
      docs-server:
        condition: service_started
    volumes:
      # Plain static file, bind-mounted directly — no render step needed.
      # (A prior version of this stack needed a config-init sidecar to
      # envsubst OIDC_* values into a template before agentgateway started;
      # with identity deferred, config.yaml has no variables left to
      # render, so that machinery is gone too. Recoverable from git history
      # at commit aef38b5 when identity work resumes.)
      - ./config.yaml:/config/config.yaml:ro
    environment:
      # Resolved by agentgateway itself into config.yaml's `github` target
      # backendAuth at startup (agentgateway does its own $VAR interpolation
      # over the config file -- see config.yaml's comment). Same GH_TOKEN
      # source as every other folder in this repo: `export GH_TOKEN=$(gh
      # auth token)` on the host before `docker compose up`.
      - GH_TOKEN=${GH_TOKEN:-}
      # agentgateway's admin UI binds 127.0.0.1:15000 by default (confirmed
      # via its own startup log and crates/agentgateway/src/config.rs at
      # v1.5.0) -- loopback-only *inside* the container, so publishing 15000
      # alone would never reach it. ADMIN_ADDR overrides the bind address;
      # 0.0.0.0 makes it reachable through the published port below. Port
      # 4000 (bind/4000 in the startup log) is the MCP proxy only -- it was
      # never serving the UI despite an earlier comment here claiming
      # localhost:4000/ui worked.
      - ADMIN_ADDR=0.0.0.0:15000
    command: ["-f", "/config/config.yaml"]
    ports:
      # The one endpoint clients talk to — multiplexes math-server and
      # docs-server behind /mcp. Published to the host (not just
      # compose-internal) so other folders' pi containers (e.g. mcp/) can
      # reach it via host.docker.internal:4000 — agentgateway/ and mcp/ are
      # separate compose projects, per this repo's one-folder-per-topic
      # convention.
      - "4000:4000"
      # Admin UI -- see ADMIN_ADDR above for why this needs that env var to
      # actually be reachable, not just published here.
      - "15000:15000"

  # Consistent with every other folder in this series (pi-multi-provider/,
  # mcp/, model-router/): pi is the client demonstrating the thing this
  # folder builds. Talks to agentgateway the same way mcp/.mcp.json talks
  # to external MCP servers — one more entry, not a special case.
  pi:
    build: .
    working_dir: /work
    volumes:
      - .:/work
      - ~/.aws:/root/.aws:ro
      # pi's Ctrl+V image paste writes the clipboard image to the host's
      # temp dir and hands pi that absolute path -- mounting $TMPDIR at the
      # identical guest path makes it visible inside the container. Same
      # pattern as mcp/'s pi service.
      - ${TMPDIR:-/tmp}:${TMPDIR:-/tmp}:ro
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Last resort in failover-proxy.mjs's chain, same as mcp/'s pi service.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-}
    ports:
      # switchyard-server, trace-server.mjs, mcp-trace-server.mjs, and
      # failover-proxy.mjs all run inside this container (started by
      # entrypoint.sh, baked into the image the same way mcp/'s is) --
      # published on 6xxx, not mcp/'s 5xxx, so both folders' stacks can run
      # at the same time without a port collision. 6000 also happens to
      # dodge macOS's AirPlay Receiver, which squats port 5000 by default.
      - "6000:4000"   # switchyard-server -- curl localhost:6000/health
      - "6321:4321"   # trace-server.mjs -- routing-decision viewer
      - "6322:4322"   # mcp-trace-server.mjs -- math/docs tool-call viewer
      - "6100:4100"   # failover-proxy.mjs -- the entrypoint pi talks to by default
    depends_on:
      - agentgateway
    stdin_open: true
    tty: true
    command: bash

  # Scrapes switchyard-server's /metrics from the pi container above, via
  # Compose's built-in DNS. Same config as mcp/'s copy (prometheus.yml
  # targets the "pi" service by name, which exists here too).
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # 9190, not mcp/'s 9090, so both folders can run at once.
      - "127.0.0.1:9190:9090"
    depends_on:
      - pi

  # Pre-provisioned (datasource + dashboard already loaded, anonymous Admin
  # access) -- open http://localhost:3100 and the routing dashboard is just
  # there. Same provisioning as mcp/'s copy.
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # 3100, not mcp/'s 3000, so both folders can run at once.
      - "127.0.0.1:3100:3000"
    depends_on:
      - prometheus
